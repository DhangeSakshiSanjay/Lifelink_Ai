<div class="col-md-6"><label>Name</label><input required name="name" class="form-control" value="{{ donor.name if donor is defined else '' }}"></div><div class="col-md-3"><label>Organ</label><select name="organ" class="form-select">{% for o in organs %}<option {% if donor is defined and donor.organ==o %}selected{% endif %}>{{o}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Blood group</label><select name="blood_group" class="form-select">{% for b in blood %}<option {% if donor is defined and donor.blood_group==b %}selected{% endif %}>{{b}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Age</label><input required type="number" min="18" max="100" name="age" class="form-control" value="{{ donor.age if donor is defined else '' }}"></div><div class="col-md-3"><label>HLA %</label><input required type="number" min="0" max="100" name="hla_match" class="form-control" value="{{ donor.hla_match if donor is defined else '' }}"></div><div class="col-md-3"><label>Antibodies %</label><input required type="number" min="0" max="100" name="antibodies" class="form-control" value="{{ donor.antibodies if donor is defined else '' }}"></div><div class="col-md-3"><label>Medical history %</label><input required type="number" min="0" max="100" name="medical_history" class="form-control" value="{{ donor.medical_history if donor is defined else '' }}"></div><div class="col-md-6"><label>Location</label><input required name="location" placeholder="Pune" class="form-control" value="{{ donor.location if donor is defined else '' }}"></div><div class="col-md-3"><label>Harvest hours</label><input type="number" step="0.1" name="harvest_hours" value="{{ donor.harvest_hours if donor is defined else 0 }}" class="form-control"></div>{% if donor is defined %}<div class="col-12"><label>Status</label><select name="status" class="form-select"><option {% if donor.status=='AVAILABLE' %}selected{% endif %}>AVAILABLE</option><option {% if donor.status=='RESERVED' %}selected{% endif %}>RESERVED</option><option {% if donor.status=='COMPLETED' %}selected{% endif %}>COMPLETED</option></select></div>{% endif %}{% if donor is not defined %}<div class="col-12"><button class="btn btn-primary">Save donor</button></div>{% endif %}
