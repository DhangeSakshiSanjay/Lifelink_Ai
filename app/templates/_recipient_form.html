<div class="col-md-6"><label>Name</label><input required name="name" class="form-control" value="{{ recipient.name if recipient is defined else '' }}"></div><div class="col-md-3"><label>Organ</label><select name="organ" class="form-select">{% for o in organs %}<option {% if recipient is defined and recipient.organ==o %}selected{% endif %}>{{o}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Blood group</label><select name="blood_group" class="form-select">{% for b in blood %}<option {% if recipient is defined and recipient.blood_group==b %}selected{% endif %}>{{b}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Age</label><input required type="number" min="18" max="100" name="age" class="form-control" value="{{ recipient.age if recipient is defined else '' }}"></div><div class="col-md-3"><label>HLA %</label><input required type="number" min="0" max="100" name="hla_match" class="form-control" value="{{ recipient.hla_match if recipient is defined else '' }}"></div><div class="col-md-3"><label>Antibodies %</label><input required type="number" min="0" max="100" name="antibodies" class="form-control" value="{{ recipient.antibodies if recipient is defined else '' }}"></div><div class="col-md-3"><label>Medical history %</label><input required type="number" min="0" max="100" name="medical_history" class="form-control" value="{{ recipient.medical_history if recipient is defined else '' }}"></div><div class="col-md-5"><label>Waiting days</label><input required type="number" min="0" name="waiting_days" class="form-control" value="{{ recipient.waiting_days if recipient is defined else 0 }}"></div><div class="col-md-4"><label>Urgency</label><select name="urgency" class="form-select">{% for u in ['Routine','Normal','Urgent','Critical'] %}<option {% if recipient is defined and recipient.urgency==u %}selected{% elif recipient is not defined and u=='Normal' %}selected{% endif %}>{{u}}</option>{% endfor %}</select></div><div class="col-md-8"><label>Hospital / location</label><input required name="location" class="form-control" value="{{ recipient.location if recipient is defined else '' }}"></div>{% if recipient is defined %}<div class="col-md-4"><label>Status</label><select name="status" class="form-select"><option {% if recipient.status=='REQUEST_ACTIVE' %}selected{% endif %}>REQUEST_ACTIVE</option><option {% if recipient.status=='MATCHING' %}selected{% endif %}>MATCHING</option><option {% if recipient.status=='COMPLETED' %}selected{% endif %}>COMPLETED</option></select></div>{% endif %}{% if recipient is not defined %}<div class="col-12"><button class="btn btn-primary">Save recipient</button></div>{% endif %}
